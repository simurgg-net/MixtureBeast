<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MixMonsters</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#10303f;--amber:#ffb703;--amber2:#e08a00;--r:18px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:radial-gradient(circle at 50% 0,#0f6a8a,#05293a);font-family:"Fredoka",ui-rounded,"Segoe UI",system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:900px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#fff}
.logo{font-weight:700;font-size:20px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.logo svg{width:26px;height:26px}
#pips{flex:1;display:flex;gap:5px;justify-content:center;transition:opacity .3s}
#pips i{width:clamp(14px,4vw,28px);height:8px;border-radius:6px;background:#ffffff33}
#pips i.on{background:#34d399}#pips i.cur{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid #ffffff44;background:#ffffff1f;color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px)}
.ib:hover{background:#ffffff38}.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#scene{position:relative;flex:0 0 auto;width:min(100%,calc(52vh*4/3));aspect-ratio:4/3;margin:0 auto;border-radius:24px;overflow:hidden;box-shadow:0 14px 40px #0006;border:3px solid #ffffff2a}
#bg{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute}.slot svg{height:100%;width:auto;display:block;overflow:visible}
#sd{left:1%;bottom:1%;height:46%}#sm{left:50%;transform:translateX(-50%);bottom:38%;height:40%}#sp{right:3%;bottom:2%;height:64%}
#sm.bob svg{animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-6px) scaleY(1.03)}}
#sm.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(calc(-50% - 8px))}40%,80%{transform:translateX(calc(-50% + 8px))}}
.bub{animation:rise 3s ease-in infinite}@keyframes rise{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}
.cf{position:absolute;top:35%;width:9px;height:14px;border-radius:2px;animation:cf 1.3s ease-out forwards;z-index:4}
@keyframes cf{to{transform:translate(var(--x),230px) rotate(540deg);opacity:0}}
#panel{flex:1;min-height:0;overflow:auto;margin-top:12px;background:#fffffff2;border-radius:28px 28px 0 0;padding:18px 18px 22px;box-shadow:0 -10px 30px #0005;display:flex;flex-direction:column;gap:12px;animation:up .35s}
@keyframes up{from{transform:translateY(14px);opacity:0}}
h1{margin:0;font-size:clamp(30px,8vw,44px);line-height:1;background:linear-gradient(90deg,#ff4d8d,#8b5cf6,#2f7df6);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:0;font-size:clamp(20px,5vw,26px)}p{margin:0;line-height:1.45;font-size:clamp(16px,4vw,19px)}
.chip{align-self:flex-start;background:#e8f4fb;color:#0b6a8f;font-weight:600;font-size:13px;border-radius:99px;padding:5px 12px}
.who{display:flex;align-items:center;gap:8px;font-size:15px}.av{width:30px;height:30px;border-radius:50%;background:#fff3d1;display:grid;place-items:center}
.tx{min-height:3.2em}
.btn{margin-top:auto;border:0;border-radius:16px;height:56px;font:700 19px "Fredoka",system-ui,sans-serif;color:#3b2400;cursor:pointer;background:linear-gradient(#ffd24d,var(--amber));box-shadow:0 5px 0 var(--amber2);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--amber2)}.btn:disabled{background:#d8dee4;color:#8996a1;box-shadow:0 5px 0 #b7c0c8;cursor:not-allowed}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.opt{border:3px solid transparent;border-radius:var(--r);padding:12px 8px;color:#fff;font:600 clamp(14px,3.6vw,18px) "Fredoka",system-ui,sans-serif;text-transform:capitalize;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;box-shadow:0 5px 0 #0003;transition:transform .12s}
.opt:hover{transform:translateY(-2px)}.opt svg{width:34px;height:34px}
.c0{background:#2f7df6}.c1{background:#19b36b}.c2{background:#f58a1f}
.opt.sel{border-color:#fff;outline:4px solid var(--amber);transform:translateY(-3px) scale(1.03)}
.opt.ok{background:#12a150;outline:4px solid #9bf0bd}.opt.no{background:#e5484d;outline:4px solid #ffb3b5;animation:shk .4s}
@keyframes shk{25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
.cards{display:grid;gap:8px}.ci{display:flex;gap:12px;align-items:center;background:#eef6fb;border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.3}
.ci b{display:block;text-transform:capitalize}.ci span{color:#456}.ic{width:30px;height:30px;flex:none;color:#0b6a8f}
#ov{position:fixed;inset:0;background:#031a26cc;display:none;align-items:center;justify-content:center;padding:14px;z-index:9;backdrop-filter:blur(4px)}
#sheet{background:#f6ecd2;border-radius:8px 22px 22px 22px;max-width:560px;width:100%;max-height:92%;overflow:auto;padding:18px;box-shadow:0 20px 50px #0008;position:relative;display:flex;flex-direction:column;gap:10px}
#sheet .tag{font-weight:700;letter-spacing:2px;color:#a3262a;font-size:13px;border:2px solid #a3262a;border-radius:6px;padding:3px 8px;align-self:flex-start;transform:rotate(-2deg)}
.mf{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:10px;box-shadow:0 2px 0 #0002}.mf svg{width:74px;flex:none}.mf p{font-size:15px}
#np{position:absolute;left:50%;transform:translateX(-50%);bottom:27%;z-index:3;background:#fff;color:var(--ink);font-weight:600;font-size:clamp(11px,2.6vw,15px);padding:4px 12px;border-radius:99px;box-shadow:0 3px 0 #0003;white-space:nowrap}#np:empty{display:none}
#sd svg{animation:hop 1.8s ease-in-out infinite;transform-origin:50% 100%}@keyframes hop{50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#ffb703" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/><path d="M7.5 15h9"/></svg>MixMonsters</div>
 <div id="pips"></div>
 <button class="ib" id="fb" aria-label="Monster files"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
 <button class="ib" id="mb" aria-label="Sound"><svg viewBox="0 0 24 24" id="mi"></svg></button>
</header>
<div id="scene"><svg id="bg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMax slice"></svg>
 <div class="slot" id="sd"></div><div id="np"></div><div class="slot bob" id="sm"></div><div class="slot" id="sp"></div></div>
<section id="panel"></section>
</div>
<div id="ov"><div id="sheet"></div></div>
<script>
const $=i=>document.getElementById(i);
// ---- Edit monster data here ----
const MON=[
 {n:"Pink",kind:"rock",tag:"Pebbly Pink",look:"crunchy pebbles & sand",c:"#e8457f",l:"#ff9ac0",eyes:1,horns:0,state:"solid",mix:"heterogeneous",sep:"sieving",info:"A mixture of pebbles and sand. You can see the parts separately."},
 {n:"Purple",kind:"mud",tag:"Muddy Purple",look:"sloshy muddy water",c:"#8a4fd6",l:"#bfa6ff",eyes:1,horns:1,state:"liquid",mix:"heterogeneous",sep:"filtration",info:"Muddy water. It flows, with solid bits floating in it."},

// ---- Art ----
function poster(){let g="";const cl=["#ff6b9d","#ffb703","#38bdf8","#34d399","#8b5cf6"];for(let r=0;r<4;r++)for(let c=0;c<6;c++)g+=`<rect x="${84+c*7.4}" y="${48+r*8.4}" width="6" height="7" rx="1" fill="${cl[(r+c)%5]}"/>`;

function lab(){let f=(x,y)=>`<path transform="translate(${x} ${y})" d="M-4 -14v-8h8v8l6 12a3 3 0 0 1-2.6 4.4h-10.8A3 3 0 0 1-10-2z" fill="none" stroke="#9aa6b2" stroke-width="1.4"/>`,sh=(x)=>{let o=`<rect x="${x}" y="28" width="64" height="162" fill="#3d444d" stroke="#5b6570" stroke-width="3"/>`;for(let r=0;r<4;r++){o+=`<rect x="${x}" y="${58+r*34}" width="64" height="3" fill="#6b7580"/>`;for(let c=0;c<3;c++)o+=f(x+14+c*18,56+r*34)}return o};
return `<defs><linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e7490"/><stop offset="1" stop-color="#0a5a7a"/></linearGradient><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3ecf7"/><stop offset="1" stop-color="#b3c6e0"/></linearGradient><radialGradient id="gl"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>

${poster()}${sh(0)}${sh(336)}<rect y="190" width="400" height="110" fill="url(#fl)"/><path d="M200 190V300M120 190L40 300M280 190l80 110M0 230h400M0 262h400" stroke="#9db3d1" stroke-width="1.2" opacity=".6"/>
<rect x="76" y="182" width="248" height="11" rx="4" fill="#f0f3f7"/><rect x="88" y="193" width="8" height="70" fill="#9aa3ad"/><rect x="304" y="193" width="8" height="70" fill="#9aa3ad"/>
<circle cx="110" cy="166" r="13" fill="#ffa63a"/><rect x="106" y="146" width="8" height="12" fill="#ffd9a3"/><circle class="bub" cx="108" cy="162" r="2" fill="#fff"/><circle class="bub" style="animation-delay:1s" cx="114" cy="168" r="1.6" fill="#fff"/>
<path d="M290 148v8l-14 26h28l-14-26" fill="#ff4d8d" transform="translate(0 -2)"/><circle class="bub" style="animation-delay:.5s" cx="290" cy="170" r="2" fill="#fff"/>
<g><rect x="136" y="164" width="7" height="18" rx="3" fill="#ff6b9d"/><rect x="146" y="164" width="7" height="18" rx="3" fill="#6ee7a8"/><rect x="156" y="164" width="7" height="18" rx="3" fill="#ffc15a"/></g>`}
const dots=(n,a,b,r,col)=>Array.from({length:n},(_,i)=>`<circle cx="${22+(i*a)%76}" cy="${44+(i*b)%84}" r="${r}" fill="${col}"/>`).join("");
const fx=(x,id)=>{let o="",ex="";
 if(x.kind=="rock")o=dots(26,37,53,1.7,"#f2d9a0")+[[34,72,8,"#8d8f99"],[84,66,7,"#a9856a"],[46,112,9,"#7b7f8c"],[80,112,7,"#b99572"],[26,102,6,"#9a9ca6"],[94,94,5,"#8d6f55"]].map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="${a[2]}" fill="${a[3]}" stroke="#0003" stroke-width="1.5"/>`).join("");
 else if(x.kind=="mud")o=`<path d="M10 96q12-9 25 0t25 0t25 0t25 0V150H10z" fill="#7a5a3a" opacity=".8"/><circle class="bub" cx="40" cy="112" r="4" fill="#fff" opacity=".7"/><circle class="bub" style="animation-delay:1s" cx="78" cy="120" r="3" fill="#fff" opacity=".7"/>`+dots(8,41,29,2.4,"#4a3420").replace(/cy="(\d+)"/g,(_,y)=>`cy="${100+(y%30)}"`);
 else{o=dots(14,37,53,1.7,"#f2d9a0")+Array.from({length:22},(_,i)=>{const a=i*2.4,cx=24+(i*29)%72,cy=50+(i*47)%80;return `<path d="M${cx} ${cy}l${(4*Math.cos(a)).toFixed(1)} ${(4*Math.sin(a)).toFixed(1)}" stroke="#222836" stroke-width="2.4" stroke-linecap="round"/>`}).join("");ex=`<path d="M100 36v14a9 9 0 0 0 18 0V36h-6v14a3 3 0 0 1-6 0V36z" fill="#e5484d"/><path d="M100 36h6M112 36h6" stroke="#cfd6dd" stroke-width="5"/>`}
 return `<clipPath id="c${id}"><ellipse cx="60" cy="86" rx="44" ry="54"/></clipPath><g clip-path="url(#c${id})">${o}</g>${ex}`};
const mon=(x,id)=>{const e=x.eyes==2?`<circle cx="44" cy="52" r="12" fill="#fff"/><circle cx="76" cy="52" r="12" fill="#fff"/><circle cx="45" cy="53" r="6" fill="#1d2433"/><circle cx="75" cy="53" r="6" fill="#1d2433"/><circle cx="47" cy="50" r="2" fill="#fff"/><circle cx="77" cy="50" r="2" fill="#fff"/>`:`<circle cx="60" cy="56" r="18" fill="#fff"/><circle cx="60" cy="57" r="9.5" fill="#1d2433"/><circle cx="63" cy="53" r="3.2" fill="#fff"/>`,
h=x.horns?`<path d="M26 40L14 14l26 14zM94 40l12-26-26 14z" fill="${x.c}"/>`:x.eyes==2?`<path d="M44 44Q40 24 38 18M76 44Q80 24 82 18" stroke="${x.c}" stroke-width="4" fill="none"/>`:`<path d="M60 36q-2-14 8-20" stroke="${x.c}" stroke-width="4" fill="none"/><circle cx="69" cy="15" r="5" fill="${x.l}"/>`;
return `<svg viewBox="0 0 120 150"><defs><radialGradient id="g${id}" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="${x.l}"/><stop offset="1" stop-color="${x.c}"/></radialGradient></defs><ellipse cx="60" cy="144" rx="34" ry="5" fill="#0003"/>${h}<ellipse cx="42" cy="136" rx="14" ry="8" fill="${x.c}"/><ellipse cx="78" cy="136" rx="14" ry="8" fill="${x.c}"/><path d="M20 90q-14-8-10-24M100 90q14-8 10-24" stroke="${x.c}" stroke-width="9" stroke-linecap="round" fill="none"/><ellipse cx="60" cy="86" rx="44" ry="54" fill="url(#g${id})"/>${fx(x,id)}<ellipse cx="60" cy="108" rx="26" ry="24" fill="#fff" opacity=".2"/><circle cx="30" cy="92" r="5" fill="#fff" opacity=".25"/><circle cx="92" cy="76" r="4" fill="#fff" opacity=".25"/>${e}<path d="M38 88q22 26 44 0z" fill="#5a0f2a"/><path d="M44 89l4 8 4-8zM68 89l4 8 4-8z" fill="#fff"/><ellipse cx="60" cy="98" rx="8" ry="4" fill="#ff7a9a"/><circle cx="26" cy="80" r="6" fill="#ff7aa0" opacity=".5"/><circle cx="94" cy="80" r="6" fill="#ff7aa0" opacity=".5"/></svg>`};
const PROF=`<svg viewBox="-30 0 170 232"><ellipse cx="70" cy="226" rx="48" ry="6" fill="#0003"/><rect x="48" y="172" width="18" height="48" rx="4" fill="#26303b"/><rect x="76" y="172" width="18" height="48" rx="4" fill="#26303b"/><ellipse cx="54" cy="222" rx="17" ry="7" fill="#111"/><ellipse cx="88" cy="222" rx="17" ry="7" fill="#111"/>
<path d="M112 110l9 42" stroke="#fff" stroke-width="15" stroke-linecap="round"/><circle cx="122" cy="154" r="8" fill="#ffd9bf"/>
<path d="M30 100q40-18 80 0l10 80H20z" fill="#fff" stroke="#cdd6e2" stroke-width="3"/><path d="M70 98l-15 26 15 52 15-52z" fill="#eef2f8"/><path d="M66 102h8l4 14-8 9-8-9z" fill="#1f2937"/><g fill="#9aa8b8"><circle cx="70" cy="140" r="2.5"/><circle cx="70" cy="154" r="2.5"/><circle cx="70" cy="168" r="2.5"/></g>
<path d="M30 108L8 82" stroke="#fff" stroke-width="15" stroke-linecap="round"/><circle cx="6" cy="79" r="8" fill="#ffd9bf"/><path d="M6 79L-26 36" stroke="#8b5a2b" stroke-width="3.5" stroke-linecap="round"/>
<circle cx="42" cy="68" r="13" fill="#f7f9fc" stroke="#dfe5ee" stroke-width="2"/><circle cx="98" cy="68" r="13" fill="#f7f9fc" stroke="#dfe5ee" stroke-width="2"/><circle cx="70" cy="64" r="30" fill="#ffd9bf"/>

<path d="M49 56h14M77 56h14" stroke="#f7f9fc" stroke-width="5" stroke-linecap="round"/><circle cx="58" cy="66" r="10" fill="#fff6" stroke="#3a3a3a" stroke-width="2.5"/><circle cx="82" cy="66" r="10" fill="#fff6" stroke="#3a3a3a" stroke-width="2.5"/><path d="M68 66h4" stroke="#3a3a3a" stroke-width="2.5"/><circle cx="58" cy="67" r="3.4" fill="#222"/><circle cx="82" cy="67" r="3.4" fill="#222"/><circle cx="46" cy="78" r="5" fill="#ff9aa8" opacity=".55"/><circle cx="94" cy="78" r="5" fill="#ff9aa8" opacity=".55"/>

const kid=(o,hc,cc)=>`<g transform="translate(${o} 0)"><rect x="22" y="128" width="14" height="44" rx="6" fill="#ffd9bf"/><rect x="44" y="128" width="14" height="44" rx="6" fill="#ffd9bf"/><rect x="17" y="166" width="23" height="11" rx="5" fill="#3b2a20"/><rect x="41" y="166" width="23" height="11" rx="5" fill="#3b2a20"/><path d="M14 94q26-14 52 0l6 48H8z" fill="${cc}"/><path d="M14 94q26-14 52 0l6 48H8z" fill="url(#pl)"/><circle cx="40" cy="62" r="26" fill="#ffd9bf"/><path d="M14 62q0-30 26-30t26 30q-8-14-26-14T14 62z" fill="${hc}"/><path d="M12 50q28-34 56 0q-28-10-56 0z" fill="#9a7048"/><path d="M26 34q14-14 28 0z" fill="#8a6038"/><circle cx="31" cy="64" r="3.2" fill="#2b1b12"/><circle cx="49" cy="64" r="3.2" fill="#2b1b12"/><path d="M33 74q7 6 14 0" stroke="#b5483a" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="25" cy="72" r="4" fill="#ff9aa8" opacity=".5"/><circle cx="55" cy="72" r="4" fill="#ff9aa8" opacity=".5"/><circle cx="68" cy="112" r="14" fill="#fff6" stroke="#2b2b2b" stroke-width="4"/><path d="M58 123l-9 13" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/></g>`;
const kid2=(o,cc,hat,hc,sk)=>`<g transform="translate(${o} 0)"><rect x="26" y="150" width="16" height="40" rx="7" fill="#35507a"/><rect x="54" y="150" width="16" height="40" rx="7" fill="#35507a"/><ellipse cx="32" cy="192" rx="15" ry="8" fill="#ffd23f"/><ellipse cx="62" cy="192" rx="15" ry="8" fill="#ffd23f"/><path d="M86 126l24-28" stroke="${cc}" stroke-width="15" stroke-linecap="round"/><path d="M10 112q38-20 76 0l8 54H2z" fill="${cc}"/><path d="M10 112q38-20 76 0l8 54H2z" fill="url(#pl)"/><path d="M48 124l5 10h11l-9 7 3 11-10-7-10 7 3-11-9-7h11z" fill="#ffd23f" stroke="#b8860b" stroke-width="1.5"/><circle cx="110" cy="96" r="9" fill="${sk}"/><circle cx="48" cy="72" r="34" fill="${sk}"/><path d="M14 74q-2-34 34-36t34 36q-8-20-34-22T14 74z" fill="${hc}"/><path d="M12 56q4-40 36-40t36 40q-36-14-72 0z" fill="${hat}"/><path d="M12 56q4-40 36-40t36 40q-36-14-72 0z" fill="url(#pl)"/><path d="M6 59q42-14 84 0q-6 9-42 7T6 59z" fill="${hat}" stroke="#0003" stroke-width="1.5"/><circle cx="48" cy="14" r="5" fill="${hat}"/><ellipse cx="36" cy="78" rx="8" ry="9" fill="#fff"/><ellipse cx="60" cy="78" rx="8" ry="9" fill="#fff"/><circle cx="37" cy="79" r="5.2" fill="#2b1b12"/><circle cx="61" cy="79" r="5.2" fill="#2b1b12"/><circle cx="39" cy="76.5" r="2" fill="#fff"/><circle cx="63" cy="76.5" r="2" fill="#fff"/><circle cx="26" cy="90" r="5" fill="#ff8aa0" opacity=".55"/><circle cx="70" cy="90" r="5" fill="#ff8aa0" opacity=".55"/><path d="M38 92q10 13 20 0z" fill="#a8323e"/><path d="M42 97q6 4 12 0" fill="#ff7a8a"/><path d="M108 94l-5 7" stroke="#6b3e1e" stroke-width="7" stroke-linecap="round"/><circle cx="122" cy="80" r="20" fill="#bfeaff" fill-opacity=".6" stroke="#d93a3a" stroke-width="6"/><path d="M113 72a12 12 0 0 1 10-7" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/></g>`;
const DET=`<svg viewBox="0 0 280 200"><defs><pattern id="pl" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 5h10M5 0v10" stroke="#fff5" stroke-width="2"/></pattern></defs>${kid2(0,"#e8503a","#ff9f1c","#3b2a20","#ffd9bf")}${kid2(134,"#1f9d8b","#7c5cff","#1d1612","#f1c9a5")}</svg>`;
const DET_OLD=`<svg viewBox="0 0 170 180"><defs><pattern id="pl" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 5h10M5 0v10" stroke="#fff4" stroke-width="2"/></pattern></defs>${kid(0,"#3b2a20","#8b5e3c")}${kid(84,"#1d1612","#7a4f32")}</svg>`;
const BADGE=`<svg viewBox="0 0 120 150"><defs><radialGradient id="bg2" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff0a8"/><stop offset="1" stop-color="#e3a712"/></radialGradient></defs><path d="M34 80l-14 56 24-12 12 20 10-56zM86 80l14 56-24-12-12 20-10-56z" fill="#d1303a"/><circle cx="60" cy="56" r="46" fill="#c98a0a"/><circle cx="60" cy="56" r="41" fill="url(#bg2)"/><circle cx="60" cy="56" r="33" fill="none" stroke="#fff8" stroke-width="2" stroke-dasharray="3 4"/><path d="M60 26l8 18 19 2-14 13 4 19-17-10-17 10 4-19-14-13 19-2z" fill="#fff" opacity=".9"/><text x="60" y="84" text-anchor="middle" font-family="Fredoka,system-ui" font-weight="700" font-size="9" fill="#5a3a00">MATTER MASTER</text></svg>`;
$("bg").innerHTML=lab();
// ---- Audio / voice ----
let ac,mt,tm,muted=false;
const ICO={on:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>',off:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/>'};
const mi=()=>$("mi").innerHTML=muted?ICO.off:ICO.on;mi();
function ctx(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}return ac}
function note(f,t,d,v){const a=ctx();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain();o.type="triangle";o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+d)}
function music(){if(mt)return;const n=[392,494,587,494,440,523,659,523];let i=0;mt=setInterval(()=>note(n[i++%8],0,.35,.035),380)}
const sfx=ok=>ok?[523,659,784].forEach((f,i)=>note(f,i*.1,.25,.09)):[220,170].forEach((f,i)=>note(f,i*.14,.3,.09));
function say(t){try{speechSynthesis.cancel();if(muted)return;const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
$("mb").onclick=()=>{muted=!muted;mi();if(muted)try{speechSynthesis.cancel()}catch(e){}};
// ---- UI helpers ----
let s=0,m=0,miss=0,sel=null;
const slots=(d,mo,p)=>{$("np").textContent="";$("sd").innerHTML=d||"";$("sm").innerHTML=mo||"";$("sp").innerHTML=p||"";$("sm").className="slot bob"};
const pips=()=>{$("pips").innerHTML=Array.from({length:9},(_,i)=>`<i class="${i<s*3+m?"on":i==s*3+m?"cur":""}"></i>`).join("");$("pips").style.opacity=1};
const cards=a=>`<div class="cards">${a.map(([k,d])=>`<div class="ci">${ic(k)}<div><b>${k}</b><span>${d}</span></div></div>`).join("")}</div>`;
function type(el,t){let i=0;clearInterval(tm);el.textContent="";tm=setInterval(()=>{el.textContent=t.slice(0,++i);if(i>=t.length)clearInterval(tm)},16)}
function confetti(){const c=["#ff4d8d","#ffb703","#34d399","#38bdf8","#8b5cf6"];for(let i=0;i<30;i++){const p=document.createElement("i");p.className="cf";p.style.cssText=`left:${35+Math.random()*30}%;background:${c[i%5]};--x:${(Math.random()-.5)*320}px;animation-delay:${Math.random()*.2}s`;$("scene").appendChild(p);setTimeout(()=>p.remove(),1700)}}
function talk(text,btn,next,extra,show){slots(DET,show||"",PROF);
 $("panel").innerHTML=`<div class="who"><span class="av">🎓</span><b>Professor</b></div><p id="tx" class="tx"></p>${extra||""}<button class="btn" id="go">${btn}</button>`;
 type($("tx"),text);say(text);$("go").onclick=()=>{clearInterval(tm);try{speechSynthesis.cancel()}catch(e){}next()}}
function openFile(label,cb){$("sheet").innerHTML=`<span class="tag">TOP SECRET · MONSTER FILES</span>${MON.map((x,i)=>`<div class="mf">${mon(x,"f"+i)}<div><b>${x.tag}</b><p>${x.info}</p></div></div>`).join("")}<button class="btn" id="cl">${label}</button>`;
 $("ov").style.display="flex";$("cl").onclick=()=>{$("ov").style.display="none";cb&&cb()}}
$("fb").onclick=()=>openFile("Back to the case");
// ---- Flow ----
function title(){s=0;m=0;miss=0;$("pips").style.opacity=0;slots(DET,mon(MON[0],"t"),PROF);
 $("panel").innerHTML=`<h1>MixMonsters</h1><p>Strange mixture monsters have escaped the lab! Become a Matter Detective, study the files and sort them out.</p><button class="btn" id="go">▶ Play</button>`;
 $("go").onclick=()=>{music();ctx()&&ac.resume();talk("The substances in my laboratory mixed together and created mixture monsters! I’m assigning you the role of matter detectives to resolve this situation.","Let’s investigate",files)}}
function files(){slots(DET,"","");pips();$("panel").innerHTML=`<h2>Read the Monster Files</h2><p>Study each monster carefully. You can reopen the files any time with the folder button.</p><button class="btn" id="go">Open the files</button>`;
 const o=()=>openFile("Start investigating",quiz);$("go").onclick=o;o()}
function quiz(){const S=ST[s],x=MON[m];pips();slots(DET,mon(x,"q"),"");$("np").textContent=x.tag+" · "+x.look;sel=null;
 $("panel").innerHTML=`<div class="chip">Stage ${s+1} · ${S.name} · Monster ${m+1}/3</div><h2>${S.q}</h2><div class="opts">${S.opts.map((o,i)=>`<button class="opt c${i}" data-o="${o}">${ic(o)}<span>${o}</span></button>`).join("")}</div><button class="btn" id="go" disabled>Check answer</button>`;
 const bs=[...document.querySelectorAll(".opt")],go=$("go");
 bs.forEach(b=>b.onclick=()=>{sel=b.dataset.o;bs.forEach(z=>z.classList.toggle("sel",z==b));go.disabled=false});
 go.onclick=()=>{const ok=sel===x[S.key];bs.forEach(b=>b.disabled=true);go.disabled=true;bs.find(b=>b.dataset.o===sel).classList.add(ok?"ok":"no");
  if(ok){confetti();sfx(1)}else{miss++;$("sm").classList.add("shake");sfx(0)}
  setTimeout(()=>ok?praise():talk(S.wrong,"Try again",quiz,cards(S.cards),mon(x,"w")),1000)}}
function praise(){const last=m==2;
 if(s==2&&last)return talk("You completed the separation process correctly! The monsters have been cleared away. Thank you.","Continue",badge);
 talk("Great job! You’re doing very well!","Next",()=>{if(last){const d=s;s++;m=0;pips();talk(ST[d].next,"Continue",quiz,d==1?cards(ST[2].cards):"")}else{m++;quiz()}})}
function badge(){s=2;m=3;pips();slots(DET,BADGE,PROF);const t="I’m awarding you the Matter Master badge for your achievements.";
 $("panel").innerHTML=`<h1>Matter Master!</h1><p>${t}</p><div class="chip">${miss?miss+" retry"+(miss>1?"s":""):"Perfect run, no mistakes!"}</div><button class="btn" id="go">Play again</button>`;
 say(t);confetti();setTimeout(confetti,500);$("go").onclick=title}
title();
</script>
